name: ci

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    name: CPU tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test (GPU tests skip by design)
        run: pytest -q
      - name: Prove the environment entrypoint works
        run: python scripts/probe_env.py
      - name: Upload measured CPU artifacts
        uses: actions/upload-artifact@v4
        with:
          name: results-py${{ matrix.python-version }}
          path: results/
          if-no-files-found: ignore

  # GitHub-hosted runners have no NVIDIA GPU, so a real CUDA build/test job
  # cannot run by default. This job is guarded by the repository variable
  # ENABLE_CUDA_CI and expects a self-hosted runner labelled `gpu` with CUDA,
  # nvcc and a working Triton install. With the variable unset the job is
  # skipped, keeping CI green on ordinary pull requests.
  build-cuda:
    name: CUDA build + GPU tests (self-hosted, opt-in)
    if: ${{ vars.ENABLE_CUDA_CI == 'true' }}
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install triton
      - name: Lint
        run: ruff check .
      - name: GPU + CPU test suite
        run: pytest -q
      - name: Probe environment
        run: python scripts/probe_env.py
      - name: Build optional CUDA C++ baseline
        run: python -c "from flashattn_tile import native; assert native.is_available(), native.unavailable_reason()"
      - name: Decode benchmark
        run: python scripts/benchmark.py --mode decode --iters 20
